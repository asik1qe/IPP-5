<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Телефонные контакты — Леденёв Глеб</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Телефонные контакты</h1>
    <p class="subtitle">Практическая работа №5 — Леденёв Глеб</p>

    <section class="card">
      <h2 id="form-title">Новый контакт</h2>
      <form id="contact-form">
        <input id="name" placeholder="ФИО" required>
        <input id="phone" placeholder="Телефон" required>
        <input id="email" type="email" placeholder="Email">
        <input id="company" placeholder="Организация">
        <div class="buttons">
          <button type="submit">Сохранить</button>
          <button type="button" id="cancel" class="secondary" hidden>Отмена</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="heading-row">
        <h2>Список контактов</h2>
        <button id="reload" class="secondary">Обновить</button>
      </div>
      <div id="status"></div>
      <table>
        <thead>
          <tr><th>ID</th><th>ФИО</th><th>Телефон</th><th>Email</th><th>Организация</th><th>Действия</th></tr>
        </thead>
        <tbody id="contacts"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
